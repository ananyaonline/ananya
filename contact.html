<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get in Touch</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" type="image/png" sizes="192x192" href="assets/images/favicon.png">
</head>
<body class="contact-page fira-sans-regular">

  <!-- HAMBURGER + DROPDOWN -->
  <img class="hamburger" src="assets/images/hamburg.png" alt="Menu" />
  <ul class="dropdown-menu fira-sans-regular">
    <li><a href="about.html">About Me</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li>
      <a href="assets/ananya-full-portfolio.pdf" target="_blank">
        View Full Portfolio (PDF)
      </a>
    </li>
  </ul>

  <!-- CONTACT CONTENT -->
  <main class="contact-container">
    <h1 class="contact-title">Get in Touch</h1>

    <!-- Direct Links -->
<div class="contact-links">
  <a href="mailto:ananyajoshionline@gmail.com" class="contact-button">Email</a>
  <a href="https://instagram.com/ananyaj" target="_blank" class="contact-button">Instagram</a>
  <a href="https://www.linkedin.com/in/ananyaonline/" target="_blank" class="contact-button">LinkedIn</a>
</div>

<style>
.contact-links {
  display: flex; /* Arranges the buttons horizontally */
  gap: 10px; /* Adds space between the buttons */
  justify-content: center; /* Centers the buttons (optional) */
}

.contact-button {
  /* Button Styling */
  display: inline-block;
  padding: 8px 15px; /* Vertical and horizontal spacing inside the button */
  border: 1px solid #f0f0f0; /* A slight border */
  background-color: #333; /* Light background color */
  color: #f0f0f0; /* Text color */
  text-decoration: none; /* Removes the default underline */
  text-align: left;
  
  /* Rounded Edges */
  border-radius: 20px; /* Key for making it rounded */
  
  /* Optional: Hover effect for interactivity */
  transition: background-color 0.3s ease;
}

.contact-button:hover {
  background-color: #ddd; /* Darken slightly on hover */
  color: #000;
}

</style>

    <!-- Contact Form -->
    <form action="https://formspree.io/f/xdklnebr" method="POST" class="contact-form">
      <label>
        Your Name:
        <input type="text" name="name" required>
      </label>
      <label>
        Subject:
        <input type="email" name="_replyto" required>
      </label>
      <label>
        Message:
        <textarea name="message" rows="5" required></textarea>
      </label>
      <button type="submit">Send</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
